[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "llm4rec-research-lab"
version = "0.1.0"
description = "Auditable capability-directed data selection and exploration research kernels"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "torch>=2.2"]
[project.optional-dependencies]
test = ["pytest>=8"]
hf = ["transformers>=4.51,<6", "peft>=0.15,<1", "accelerate>=1,<2"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
